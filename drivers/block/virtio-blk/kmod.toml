# virtio-blk: a block device over virtio 1.x, bound from the device tree's memory-mapped
# virtio slots.
#
# The first driver with DMA: the device reads and writes the rings and buffers the kernel
# hands it. The virtqueue, the status handshake and the block requests are host-tested
# against a fake device on the other side of the rings, so nothing here is gated on an
# architecture.
[unit]
name = "virtio-blk"
kind = "lib"
root = "src/lib.rs"
host-tests = true
layer = "device"

[deps]
units = ["hal", "device", "block", "sync"]
