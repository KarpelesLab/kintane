# The `platform` provider for ports with nothing to enumerate yet. Today that is no port:
# aarch64 has `platform/fdt` and the PCs have `platform/acpi`. It stays for the next
# architecture, whose first boot should not need a device model. The device windows are
# the architecture's, passed through, so kmain asks `platform` on every port and never
# learns which kind it has.
#
# The condition must exclude every architecture another provider claims.
[unit]
name = "platform"
kind = "lib"
root = "src/lib.rs"
layer = "kernel"

[deps]
units = ["hal", "arch"]

[config]
requires = "!(ARCH_AARCH64 || ARCH_X86_64 || ARCH_I686)"
