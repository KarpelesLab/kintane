[unit]
name = "kintane"
kind = "bin"
root = "src/main.rs"
layer = "kernel"

# `arch` and `bootinfo` are both provider names: several units declare each, and the
# configuration selects one. The image names the role, never the machine or the
# loader.
[deps]
units = ["hal", "arch", "boot_protocol", "bootinfo", "mm", "selftest", "sched", "thread"]
