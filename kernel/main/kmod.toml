[unit]
name = "kintane"
kind = "bin"
root = "src/main.rs"
layer = "kernel"

# `arch`, `bootinfo`, `platform` and `lastgood` are provider names: several units declare
# each, and the configuration selects one. The image names the role, never the machine or
# the loader.
[deps]
units = ["hal", "arch", "boot_protocol", "bootinfo", "mm", "kalloc", "selftest", "time", "sched", "thread", "unwind", "sync", "buildid", "platform", "cmdline", "kobject", "ipc", "module", "abi", "elf", "userinit", "userchild", "block", "virtio-blk", "hwproxy", "virtio-probe", "hwdomain", "vfs", "bcache", "fat", "lastgood"]
