# `userchild` on a configuration without userspace: nothing to embed. The kernel image
# depends on the name in every configuration; only this provider is selected when
# USERSPACE is off, and the kernel's userspace modules are not compiled then either.
[unit]
name = "userchild"
kind = "lib"
root = "src/lib.rs"
layer = "user"

[deps]
units = []

[config]
requires = "!USERSPACE"
