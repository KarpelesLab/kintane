# The merge gate.
#
# The portability claim in docs/portability.md is only credible if it is checked
# continuously: every merge builds every tier-1 target, and boots the ones that have a
# QEMU machine. Gates 1, 3 and 4 in docs/testing.md#merge-gates are what this file is.
#
# Presets are discovered rather than listed, so adding config/presets/<name>.preset
# adds it to the gate automatically and there is no second place to forget to update.

name: ci

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The toolchain pin is checked on its own, first, because every other failure is
  # ambiguous until we know the compiler is the one we intended.
  toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pin
        name: Read the pinned channel from toolchain.toml
        run: |
          channel=$(grep -E '^channel' toolchain.toml | head -1 | cut -d'"' -f2)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "pinned channel: $channel"
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install "${{ steps.pin.outputs.channel }}" \
            --component rust-src --component llvm-tools --profile minimal
      - name: Build kbuild
        run: cargo build --release --manifest-path kbuild/Cargo.toml
      - name: Verify the pin
        run: ./kbuild/target/release/kbuild toolchain

  # Host tests: kbuild's own suite, plus every kernel unit that declares
  # `host-tests = true` — run against both mock architecture profiles.
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pin
        run: |
          channel=$(grep -E '^channel' toolchain.toml | head -1 | cut -d'"' -f2)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install "${{ steps.pin.outputs.channel }}" \
            --component rust-src --component llvm-tools --profile minimal
      - name: kbuild's own tests
        run: cargo test --manifest-path kbuild/Cargo.toml
      - name: Build kbuild
        run: cargo build --release --manifest-path kbuild/Cargo.toml
      - name: Kernel host tests
        run: ./kbuild/target/release/kbuild test --preset x86_64-qemu
      # A provider the default preset does not select is not built by the step above.
      # `bootinfo` from boot/info-kinboot exists only in the UEFI configuration.
      - name: Host tests of the kinboot handover
        run: ./kbuild/target/release/kbuild test --preset x86_64-efi --only bootinfo
      # And boot/info-board, the build-time memory map, exists only on a described board.
      - name: Host tests of the board description
        run: ./kbuild/target/release/kbuild test --preset armv7m-mps2 --only bootinfo
      # Every input that ever crashed a parser, replayed. Seconds, not minutes: the long
      # campaigns are nightly (nightly.yml), and this is what keeps a crasher fixed once
      # from coming back in a later change. See docs/testing.md, "Fuzzing".
      - name: Replay the fuzzing corpus
        run: ./kbuild/target/release/kbuild fuzz --smoke --preset x86_64-qemu
      # And a short campaign per target from a fixed seed, so a change that makes a
      # generator or a parser panic on its own inputs fails here rather than overnight.
      - name: A short fuzzing campaign
        run: ./kbuild/target/release/kbuild fuzz --preset x86_64-qemu --seed 1 --iterations 200

  # "No discussion; the time is better spent elsewhere" — docs/coding-standards.md.
  # A formatting rule nobody enforces is a rule every author negotiates privately, which
  # is exactly the discussion that sentence exists to prevent. Nightly rustfmt because
  # rustfmt.toml uses options that are not stable.
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pin
        run: |
          channel=$(grep -E '^channel' toolchain.toml | head -1 | cut -d'"' -f2)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Install the pinned toolchain with rustfmt
        run: |
          rustup toolchain install "${{ steps.pin.outputs.channel }}" \
            --component rustfmt --profile minimal
      - name: Check formatting
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            if ! rustfmt +"${{ steps.pin.outputs.channel }}" --edition 2024 --check "$f" >/dev/null; then
              echo "::error file=$f::not formatted; run rustfmt on it"
              fail=1
            fi
          done < <(git ls-files '*.rs')
          exit $fail

  # Host tests run against a host `core`, which has every atomic, so they cannot show
  # that a unit compiles for a machine without compare-and-swap. This can. Core is built
  # from the pinned toolchain's rust-src, so no extra rustup targets are needed.
  portability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pin
        run: |
          channel=$(grep -E '^channel' toolchain.toml | head -1 | cut -d'"' -f2)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install "${{ steps.pin.outputs.channel }}" \
            --component rust-src --component llvm-tools --profile minimal
      - run: cargo build --release --manifest-path kbuild/Cargo.toml
      - run: ./kbuild/target/release/kbuild portability

  # The rule that makes the portability claim checkable rather than aspirational:
  # cfg selects modules and crates, never lines inside one.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --manifest-path kbuild/Cargo.toml
      - run: ./kbuild/target/release/kbuild lint

  # Every tier-1 target, every preset, every merge.
  build-and-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pin
        run: |
          channel=$(grep -E '^channel' toolchain.toml | head -1 | cut -d'"' -f2)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install "${{ steps.pin.outputs.channel }}" \
            --component rust-src --component llvm-tools --profile minimal
      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          # ovmf: UEFI firmware for the x86_64-efi preset, which boots through
          # kinboot-efi instead of QEMU's -kernel loader.
          sudo apt-get install -y -qq qemu-system-x86 qemu-system-arm qemu-system-misc ovmf
          qemu-system-x86_64 --version | head -1
      - name: Build kbuild
        run: cargo build --release --manifest-path kbuild/Cargo.toml

      - name: Build every preset
        run: |
          set -euo pipefail
          fail=0
          for p in config/presets/*.preset; do
            name=$(basename "$p" .preset)
            echo "::group::build $name"
            if ./kbuild/target/release/kbuild build --preset "$name"; then
              echo "build ok: $name"
            else
              echo "::error title=build failed::preset $name"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      # Gate 8 in docs/testing.md: each preset's SIZE_BUDGET_KIB. The deltas against
      # config/size-baseline are printed for the reviewer; only the budget fails.
      - name: Size budget on every preset
        run: |
          set -euo pipefail
          fail=0
          for p in config/presets/*.preset; do
            name=$(basename "$p" .preset)
            echo "::group::size $name"
            if ./kbuild/target/release/kbuild size --preset "$name"; then
              echo "size ok: $name"
            else
              echo "::error title=over size budget::preset $name"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      # docs/portability.md, "Buying the indirection back": a single-provider image must
      # reach its interrupt controller without an indirect call, and a multi-driver image
      # must still go through the vtable. Checking both halves is what stops this passing
      # because the disassembly could not see an indirect branch at all.
      - name: Interrupt dispatch is static where it should be
        run: |
          set -euo pipefail
          sysroot=$(rustup run "${{ steps.pin.outputs.channel }}" rustc --print sysroot)
          host=$(rustup run "${{ steps.pin.outputs.channel }}" rustc -vV | sed -n 's/^host: //p')
          objdump="$sysroot/lib/rustlib/$host/bin/llvm-objdump"
          ./kbuild/target/release/kbuild build --preset aarch64-virt-gicv3
          static=$("$objdump" -d --disassemble-symbols=kintane_irq_dispatch \
            build/aarch64-kintane/out/kintane.elf)
          if ! grep -q 'kintane_irq_dispatch>:' <<<"$static"; then
            echo "::error title=no static dispatch::kintane_irq_dispatch is missing"; exit 1
          fi
          if grep -qE '\bblr\b' <<<"$static"; then
            echo "::error title=indirect call::the single-provider dispatch has a blr"; exit 1
          fi
          ./kbuild/target/release/kbuild build --preset aarch64-virt
          dynamic=$("$objdump" -d --disassemble-symbols=aarch64_exception \
            build/aarch64-kintane/out/kintane.elf)
          if ! grep -qE '\bblr\b' <<<"$dynamic"; then
            echo "::error title=check blind::the dynamic dispatch shows no blr either"; exit 1
          fi
          echo "static dispatch: no indirect call; dynamic dispatch: through the vtable"

      - name: Boot every preset under QEMU
        run: |
          set -euo pipefail
          fail=0
          for p in config/presets/*.preset; do
            name=$(basename "$p" .preset)
            echo "::group::boot $name"
            # The guest signals its own result through a real exit channel
            # (isa-debug-exit / semihosting), so a pass is an exit status and never
            # a string scraped out of console output. See docs/testing.md.
            if ./kbuild/target/release/kbuild run --preset "$name" --timeout 60; then
              echo "boot ok: $name"
            else
              echo "::error title=boot failed::preset $name"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      # Every format `kbuild image` writes comes from the same linked kernel, and the ones a
      # machine here can start are started: the flat binary runs on ARMv7-M with nothing but
      # QEMU's raw loader, and a UKI is byte for byte the EFI stub image the boot step above
      # already booted. A uImage is written and its size checked; no U-Boot runs here, and
      # nothing claims one started it.
      - name: Image formats are packaged, and booted where a machine can boot them
        run: |
          set -euo pipefail
          ./kbuild/target/release/kbuild image --preset aarch64-virt --format elf
          ./kbuild/target/release/kbuild image --preset armv7m-mps2 --format bin
          timeout 120 qemu-system-arm -machine mps2-an385 \
            -kernel build/armv7m-kintane/out/kintane.bin \
            -semihosting-config enable=on,target=native \
            -serial stdio -display none -no-reboot | tee "$RUNNER_TEMP/bin-boot.log"
          grep -q "reached kmain" "$RUNNER_TEMP/bin-boot.log"
          ./kbuild/target/release/kbuild image --preset armv7m-mps2 --format uimage
          bin=$(stat -c %s build/armv7m-kintane/out/kintane.bin)
          test "$(stat -c %s build/armv7m-kintane/out/kintane.uimage)" -eq "$((bin + 64))"
          ./kbuild/target/release/kbuild image --preset x86_64-efistub --format uki
          cmp build/x86_64-kintane/out/kintane.uki.efi build/x86_64-kintane/out/kintane.efi
      - name: In-kernel tests on every preset
        run: |
          set -euo pipefail
          fail=0
          for p in config/presets/*.preset; do
            name=$(basename "$p" .preset)
            echo "::group::in-kernel tests $name"
            # Tests that cannot run on the host: real atomics, real interrupt
            # masking, and the frame allocator over the machine's actual memory map.
            if ./kbuild/target/release/kbuild test --target --preset "$name" --timeout 60; then
              echo "in-kernel ok: $name"
            else
              echo "::error title=in-kernel tests failed::preset $name"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      - name: Stack guard fault on every preset
        run: |
          set -euo pipefail
          fail=0
          for p in config/presets/*.preset; do
            name=$(basename "$p" .preset)
            # A guard that faults: an unmapped page on a kernel with an MMU, or a locked
            # PMP region on a core with Physical Memory Protection and no MMU. A preset with
            # neither has no guard, and the configuration refuses the test mode there.
            ./kbuild/target/release/kbuild config --preset "$name" > /dev/null
            if ! grep -qE '^(MM_PAGED|ARCH_HAS_PMP)=y' .config; then
              echo "stack guard skipped: $name has neither an MMU nor PMP"
              continue
            fi
            echo "::group::stack guard $name"
            # The image overflows its boot stack, or on a PMP core touches the guard from a
            # healthy stack, and passes only if the fault that ends the run is on the guard.
            # See docs/testing.md.
            if ./kbuild/target/release/kbuild run --preset "$name" \
                --set QEMU_EXIT=y --set STACK_GUARD_TEST=y --timeout 60; then
              echo "stack guard ok: $name"
            else
              echo "::error title=stack guard failed::preset $name"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      - name: Thread stack guard and null dereference on every preset
        run: |
          set -euo pipefail
          fail=0
          for p in config/presets/*.preset; do
            name=$(basename "$p" .preset)
            # The thread guard needs an MMU or PMP; see the stack guard step. The null
            # dereference needs page 0 unmapped, which only a kernel with an MMU has.
            ./kbuild/target/release/kbuild config --preset "$name" > /dev/null
            if ! grep -qE '^(MM_PAGED|ARCH_HAS_PMP)=y' .config; then
              echo "thread stack guard and null dereference skipped: $name has neither an MMU nor PMP"
              continue
            fi
            modes="THREAD_STACK_GUARD_TEST"
            if grep -q '^MM_PAGED=y' .config; then
              modes="$modes NULL_DEREF_TEST"
            else
              echo "null dereference skipped: $name has no MMU, so page 0 is not unmapped"
            fi
            # A kernel thread overflows its own stack and must fault on that stack's guard,
            # not the boot stack's and not in the stack below. Then a read of address zero
            # must fault and be reported as a null dereference.
            for mode in $modes; do
              echo "::group::$mode $name"
              if ./kbuild/target/release/kbuild run --preset "$name" \
                  --set QEMU_EXIT=y --set "$mode=y" --timeout 60; then
                echo "$mode ok: $name"
              else
                echo "::error title=$mode failed::preset $name"
                fail=1
              fi
              echo "::endgroup::"
            done
          done
          exit $fail

      # Every boot above already checks the command line arrives intact, because test builds
      # set BOOT_ARGS_CHECK. These prove the rest of the boot path: safe mode reaches the
      # kernel and has its effect on every preset, a key typed at each loader's menu picks
      # an entry the default would not, and each loader's chainload hands over what a
      # chainloaded system relies on. The last proves the EFI stub's boot counter: three
      # failed boots fall back to safe mode, and that boot clears the count. See
      # docs/testing.md.
      - name: Boot modes, the boot menu and chainloading
        run: |
          set -uo pipefail
          fail=0
          for p in config/presets/*.preset; do
            name=$(basename "$p" .preset)
            echo "::group::safe mode $name"
            if ./kbuild/target/release/kbuild run --preset "$name" --set BOOT_MODE_SAFE=y \
                --timeout 90 > build/safe.log 2>&1 \
              && grep -q "conservative: the loader's memory map follows" build/safe.log; then
              echo "safe mode ok: $name"
            else
              cat build/safe.log
              echo "::error title=safe mode failed::preset $name"
              fail=1
            fi
            echo "::endgroup::"
          done
          for name in i686-bios x86_64-efi; do
            echo "::group::menu keys $name"
            if ./kbuild/target/release/kbuild run --preset "$name" --set BOOT_MENU_TIMEOUT=30 \
                --set BOOT_TEST_KEYS=2 --set BOOT_EXPECT_MODE=safe --timeout 120; then
              echo "menu keys ok: $name"
            else
              echo "::error title=menu keys failed::preset $name"
              fail=1
            fi
            echo "::endgroup::"
          done
          for name in i686-bios x86_64-bios x86_64-efi; do
            echo "::group::chainload $name"
            if ./kbuild/target/release/kbuild run --preset "$name" --set CHAIN_TEST=y --timeout 120; then
              echo "chainload ok: $name"
            else
              echo "::error title=chainload failed::preset $name"
              fail=1
            fi
            echo "::endgroup::"
          done
          echo "::group::last-known-good x86_64-efistub"
          if ./kbuild/target/release/kbuild run --preset x86_64-efistub --set BOOT_COUNTER_TEST=y \
              --timeout 300 > build/lastgood.log 2>&1 \
            && [ "$(grep -c 'failed on purpose' build/lastgood.log)" -eq 3 ]; then
            echo "last-known-good ok"
          else
            cat build/lastgood.log
            echo "::error title=last-known-good failed::three failed boots did not fall back and confirm"
            fail=1
          fi
          echo "::endgroup::"
          exit $fail

      # A backtrace is read only after something has gone wrong, which is the worst time
      # to learn it stopped decoding. Each architecture crashes on purpose, once by panic
      # and once by fault, and the decoded report must name the functions it came from.
      # The bootable image must also carry no symbols: they belong in the bundle.
      - name: Crash reports decode against the symbol bundle
        run: |
          set -uo pipefail
          rustc="rustup run ${{ steps.pin.outputs.channel }} rustc"
          host=$($rustc -vV | sed -n 's/^host: //p')
          nm="$($rustc --print sysroot)/lib/rustlib/$host/bin/llvm-nm"
          fail=0
          for name in x86_64-qemu i686-qemu aarch64-virt riscv32-virt riscv32i-virt armv7m-mps2; do
            case $name in
              x86_64-qemu) image=build/x86_64-kintane/out/kintane.mb32.elf ;;
              i686-qemu) image=build/i686-kintane/out/kintane.img.elf ;;
              aarch64-virt) image=build/aarch64-kintane/out/kintane.img.elf ;;
              riscv32-virt) image=build/riscv32-kintane/out/kintane.img.elf ;;
              riscv32i-virt) image=build/riscv32i-kintane/out/kintane.img.elf ;;
              armv7m-mps2) image=build/armv7m-kintane/out/kintane.img.elf ;;
            esac
            for crash in PANIC:kintane::crash::nested_panic FAULT:arch::backtrace::undefined_instruction; do
              kind=${crash%%:*}
              want=${crash#*:}
              echo "::group::$name CRASH_$kind"
              ./kbuild/target/release/kbuild run --preset "$name" --set "CRASH_$kind=y" \
                --timeout 20 > build/crash.log 2>&1
              cat build/crash.log
              if grep -q "symbolized backtrace" build/crash.log \
                && grep -q "$want" build/crash.log \
                && grep -q "kintane::crash::outer" build/crash.log \
                && grep -q "kernel/main/src/crash.rs:" build/crash.log; then
                echo "decoded: $name CRASH_$kind"
              else
                echo "::error title=crash report not decoded::$name CRASH_$kind"
                fail=1
              fi
              echo "::endgroup::"
            done
            # llvm-nm exits non-zero on a file with no symbols, which is the good case.
            syms=$("$nm" "$image" 2>&1 || true)
            if [ -f "$image" ] && [[ "$syms" == *"no symbols"* ]]; then
              echo "stripped: $image"
            else
              echo "::error title=image carries symbols::$image"
              fail=1
            fi
          done
          exit $fail

      # The build ID is what stops a log from being decoded against the wrong build's
      # symbols, into names that look right. So decode a log against a different build and
      # require the refusal: a crash log from a debug build, symbols from a release one.
      # A module built from the SDK, outside the tree, must be the module kbuild builds in
      # it: same flags, same toolchain, same bytes. Otherwise the SDK builds something the
      # kernel was never tested with. See docs/modules.md, "The SDK".
      - name: A module built from the SDK is the module built in the tree
        run: |
          set -euo pipefail
          ./kbuild/target/release/kbuild sdk --preset x86_64-qemu
          work=$(mktemp -d)
          mkdir -p "$work/hello/src"
          cp modules/test/roundtrip/src/lib.rs "$work/hello/src/lib.rs"
          export RUSTC="$(rustup which --toolchain ${{ steps.pin.outputs.channel }} rustc)"
          sh build/x86_64-kintane/sdk/build-module.sh "$work/hello/src/lib.rs" test-roundtrip \
            "$work/test-roundtrip.kmod"
          cmp "$work/test-roundtrip.kmod" build/x86_64-kintane/out/modules/test-roundtrip.kmod

      - name: A log from another build is refused
        run: |
          set -uo pipefail
          ./kbuild/target/release/kbuild run --preset x86_64-qemu --set CRASH_PANIC=y \
            --set DEBUG_BUILD=n --timeout 20 > /dev/null 2>&1
          cp build/x86_64-kintane/console.log build/other-build.log
          ./kbuild/target/release/kbuild build --preset x86_64-qemu --set CRASH_PANIC=y \
            --set DEBUG_BUILD=y
          if ./kbuild/target/release/kbuild symbolize --preset x86_64-qemu \
              build/other-build.log > build/mismatch.txt 2>&1; then
            echo "::error title=build ID not checked::a log from another build was decoded"
            exit 1
          fi
          cat build/mismatch.txt
          grep -q "build ID mismatch" build/mismatch.txt

      # The long run is nightly (stress.yml). This keeps the stress image building and
      # passing its first audits on every merge, so the nightly run is never the first to
      # find that it no longer compiles.
      - name: Stress smoke on every tier-1 architecture
        run: |
          set -euo pipefail
          fail=0
          for name in x86_64-qemu i686-qemu aarch64-virt aarch64-virt-smp x86_64-qemu-smp; do
            echo "::group::stress $name"
            if ./kbuild/target/release/kbuild stress --preset "$name" --duration 20s; then
              echo "stress ok: $name"
            else
              echo "::error title=stress failed::preset $name"
              fail=1
            fi
            echo "::endgroup::"
          done
          # Phase 3's exit criterion is eight CPUs, not the presets' four. The presets stay
          # at four so every other step boots quickly; this is where eight is proven, and
          # where a thread-stack array or epoch bag sized for four would show up first.
          for name in aarch64-virt-smp x86_64-qemu-smp; do
            echo "::group::stress $name at 8 CPUs"
            if ./kbuild/target/release/kbuild stress --preset "$name" --set QEMU_CPUS=8 \
                --duration 20s; then
              echo "stress ok: $name at 8 CPUs"
            else
              echo "::error title=stress failed::preset $name at 8 CPUs"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      # A failure that cannot be investigated from CI output alone is itself a
      # harness bug, so the exception traces and images are kept.
      - name: Collect failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            build/*/qemu.log
            build/*/console.log
            build/*/out/*.elf
            build/*/out/*.debug
            build/*/out/*.img
            build/*/kinboot-bios/*.elf
            build/*/gen/config.rs
            .config
          if-no-files-found: ignore
          retention-days: 7

  # Reproducibility is a property we must not lose quietly: the same source and
  # config must produce the same bytes. Building twice in separate directories and
  # comparing hashes is the cheapest possible check of that.
  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pin
        run: |
          channel=$(grep -E '^channel' toolchain.toml | head -1 | cut -d'"' -f2)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install "${{ steps.pin.outputs.channel }}" \
            --component rust-src --component llvm-tools --profile minimal
      - run: cargo build --release --manifest-path kbuild/Cargo.toml
      - name: Build twice from scratch and compare
        run: |
          set -euo pipefail
          ./kbuild/target/release/kbuild build --preset x86_64-qemu
          a=$(sha256sum build/x86_64-kintane/out/kintane.elf | cut -d' ' -f1)
          rm -rf build
          ./kbuild/target/release/kbuild build --preset x86_64-qemu
          b=$(sha256sum build/x86_64-kintane/out/kintane.elf | cut -d' ' -f1)
          echo "first:  $a"
          echo "second: $b"
          if [ "$a" != "$b" ]; then
            echo "::error title=not reproducible::the same source produced different bytes"
            exit 1
          fi
      # The loader and the disk image have reproducibility hazards of their own: lld-link
      # stamps PE files with the time, and a FAT image records timestamps and a serial.
      - name: Build the UEFI disk image twice from scratch and compare
        run: |
          set -euo pipefail
          rm -rf build
          ./kbuild/target/release/kbuild build --preset x86_64-efi
          a=$(sha256sum build/x86_64-kintane/out/kintane.esp.img | cut -d' ' -f1)
          rm -rf build
          ./kbuild/target/release/kbuild build --preset x86_64-efi
          b=$(sha256sum build/x86_64-kintane/out/kintane.esp.img | cut -d' ' -f1)
          echo "first:  $a"
          echo "second: $b"
          if [ "$a" != "$b" ]; then
            echo "::error title=not reproducible::the same source produced a different ESP image"
            exit 1
          fi
      # The EFI stub edits a linked PE after the fact: sections appended, a descriptor
      # stamped. Anything of that taken from state that varies between builds shows here.
      - name: Build the EFI stub image twice from scratch and compare
        run: |
          set -euo pipefail
          rm -rf build
          ./kbuild/target/release/kbuild build --preset x86_64-efistub
          a=$(sha256sum build/x86_64-kintane/out/kintane.esp.img | cut -d' ' -f1)
          rm -rf build
          ./kbuild/target/release/kbuild build --preset x86_64-efistub
          b=$(sha256sum build/x86_64-kintane/out/kintane.esp.img | cut -d' ' -f1)
          echo "first:  $a"
          echo "second: $b"
          if [ "$a" != "$b" ]; then
            echo "::error title=not reproducible::the same source produced a different EFI stub image"
            exit 1
          fi
      # A release is only worth its manifest if two builds of one commit write the same
      # one. The diff names every file that differs, not only that something did.
      - name: Build a release twice from scratch and compare manifests
        run: |
          set -euo pipefail
          rm -rf build
          ./kbuild/target/release/kbuild release --preset x86_64-efistub
          cp build/release/x86_64-efistub/MANIFEST "$RUNNER_TEMP/MANIFEST.first"
          rm -rf build
          ./kbuild/target/release/kbuild release --preset x86_64-efistub
          if ! diff -u "$RUNNER_TEMP/MANIFEST.first" build/release/x86_64-efistub/MANIFEST; then
            echo "::error title=not reproducible::two builds of this commit produced different release manifests"
            exit 1
          fi
      - name: Build the BIOS disk image twice from scratch and compare
        run: |
          set -euo pipefail
          rm -rf build
          ./kbuild/target/release/kbuild build --preset i686-bios
          a=$(sha256sum build/i686-kintane/out/kinboot-bios.img | cut -d' ' -f1)
          rm -rf build
          ./kbuild/target/release/kbuild build --preset i686-bios
          b=$(sha256sum build/i686-kintane/out/kinboot-bios.img | cut -d' ' -f1)
          echo "first:  $a"
          echo "second: $b"
          if [ "$a" != "$b" ]; then
            echo "::error title=not reproducible::the same source produced a different BIOS disk"
            exit 1
          fi
