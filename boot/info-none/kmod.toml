# A unit providing `bootinfo` for platforms where no loader supplies a memory map yet.
# x86 has `info-multiboot`, aarch64 and riscv32 have `info-fdt`, and boards with a
# description under config/boards/ (ARMv7-M's mps2-an385) have `info-board`; the
# condition below must exclude every architecture another provider claims, or two
# units named `bootinfo` are enabled at once and kbuild refuses the build.
[unit]
name = "bootinfo"
kind = "lib"
root = "src/lib.rs"
layer = "core"

[deps]
units = ["boot_protocol"]

[config]
requires = "!(ARCH_X86_64 || ARCH_I686 || ARCH_AARCH64 || ARCH_RISCV32 || BOARD_DESCRIBED)"
