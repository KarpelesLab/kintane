# The decision-making half of the BIOS loader: disk layout, memory map decoding, ELF
# validation and the Multiboot structure, as plain code with host tests.
#
# The loader binary in `loader/` is not a unit of the kernel graph. It is built by
# `kbuild` for its own target (`targets/i686-kinboot.json`, no SSE, no x87) and linked at
# 0x7C00, which nothing else in the graph could share. See `kbuild/src/bios.rs`.
#
# No `config.requires`: this is byte-slice code with no `unsafe`, so it also builds, and
# its tests run, under every preset — and `kbuild portability` keeps it honest on
# machines it will never boot.
[unit]
name = "kinboot-bios"
kind = "lib"
root = "src/lib.rs"
host-tests = true
layer = "hal"

[deps]
units = []
