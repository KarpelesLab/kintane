# kinboot boot entries, written by kbuild. See docs/bootloader.md#boot-options.
timeout 0
default normal
on-failure reboot

entry normal
title KinTane
mode normal
cmdline kintane.canary=cmdline-intact

entry safe
title KinTane (safe mode)
mode safe
cmdline kintane.canary=cmdline-intact

entry recovery
title KinTane (recovery)
mode recovery
cmdline kintane.canary=cmdline-intact
